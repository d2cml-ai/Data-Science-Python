[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "housing_lima"
version = "0.2.0"
description = "Comprar vs alquilar en Lima: modelo, skills de Claude Code y dashboard de Streamlit"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "streamlit>=1.46,<2",
    "plotly>=5.20,<7",
    "matplotlib>=3.8,<4",
    "jsonschema>=4.21,<5",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
housing-lima = "housing_lima.cli:main"

# The engine lives inside the orchestrator skill so the skill folder is self-contained.
[tool.setuptools.packages.find]
where = [".claude/skills/buy-vs-rent/scripts"]
include = ["housing_lima*"]

[tool.setuptools.package-data]
housing_lima = ["schemas/*.json", "config/*.yaml", "app/*.py", "app/components/*.py", "fixtures/sample_run/*"]

[tool.pytest.ini_options]
pythonpath = [".claude/skills/buy-vs-rent/scripts"]
testpaths = ["tests"]
